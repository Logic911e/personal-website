<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bedroom Portfolio</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1424; color: #f3e9ff; font-family: 'Courier New', monospace; }
      [hidden] { display: none !important; }

      #enter { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; text-align: center; padding: 1rem; }
      #enter h1 { margin: 0; font-size: 2rem; letter-spacing: 0.1em; }
      #enter p { margin: 0; max-width: 34rem; }
      #enter button { font: inherit; font-size: 1.25rem; padding: 0.6rem 1.8rem; background: #c9a066; color: #1a1424; border: 3px solid #f3e9ff; cursor: pointer; }
      #enter a, #message a { color: #8fd3ff; }
      button:focus-visible, a:focus-visible { outline: 3px solid #8fd3ff; outline-offset: 2px; }

      #world { position: fixed; inset: 0; }
      #world canvas { display: block; image-rendering: pixelated; }

      #crosshair { position: fixed; top: 50%; left: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); pointer-events: none; z-index: 5; }
      #crosshair::before, #crosshair::after { content: ''; position: absolute; background: #fff; mix-blend-mode: difference; }
      #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
      #crosshair::after { top: 8px; left: 0; height: 2px; width: 18px; }

      #note-prompt { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: #1a1424; color: #f3e9ff; border: 2px solid #c9a066; padding: 0.4rem 0.9rem; z-index: 10; max-width: 90vw; }

      #mute-btn { position: fixed; top: 0.75rem; right: 0.75rem; font: inherit; padding: 0.35rem 0.8rem; background: #1a1424; color: #f3e9ff; border: 2px solid #f3e9ff; cursor: pointer; z-index: 30; }

      #resume { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 0.5rem; width: 100%; font: inherit; font-size: 1.5rem; color: #f3e9ff; background: rgba(10, 6, 16, 0.7); border: 0; cursor: pointer; }
      #resume small { font-size: 1rem; opacity: 0.85; }

      #card { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(10, 6, 16, 0.75); z-index: 25; }
      #card .panel { background: #2b2036; border: 4px solid #c9a066; width: min(30rem, 92vw); max-height: 80vh; display: flex; flex-direction: column; }
      #card header { display: flex; justify-content: flex-end; padding: 0.5rem 0.75rem; border-bottom: 2px solid #c9a066; }
      #card .panel-close { font: inherit; background: #c9a066; color: #1a1424; border: 2px solid #f3e9ff; padding: 0.2rem 0.7rem; cursor: pointer; }
      #card .panel-body { padding: 0.5rem 1.25rem 1.25rem; overflow-y: auto; }
      #card h2 { margin: 0.5rem 0; }
      #card a { color: #8fd3ff; font-weight: bold; }
      #card .tags span { font-size: 0.8rem; background: #1a1424; padding: 0.1rem 0.4rem; border: 1px solid #c9a066; }

      #message { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem; text-align: center; padding: 1rem; background: #1a1424; }
      #message p { margin: 0; max-width: 34rem; }
    </style>
  </head>
  <body>
    <main id="enter">
      <h1>Come on in</h1>
      <p>Wander around my room and read the notes on the board. WASD to walk, mouse to look, E to read a note, Esc to get your mouse back. Turn your sound on.</p>
      <button id="enter-btn" type="button">Enter</button>
      <a href="fallback.html">Skip the room and see the projects</a>
    </main>

    <div id="world" hidden></div>
    <div id="crosshair" hidden></div>
    <div id="note-prompt" hidden></div>
    <button id="mute-btn" type="button" aria-pressed="false" hidden>Sound: on</button>

    <button id="resume" type="button" hidden>
      Click to resume
      <small>Esc lets go of the mouse</small>
    </button>

    <div id="card" role="dialog" aria-modal="true" aria-label="Project" hidden>
      <div class="panel">
        <header><button class="panel-close" type="button">Close (Esc)</button></header>
        <div class="panel-body"></div>
      </div>
    </div>

    <div id="message" hidden>
      <p id="message-text"></p>
      <a href="fallback.html">See the projects as a plain list</a>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
